name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [claude/personal-book-library-wva5wu, main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes do SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Gerar chave de assinatura
        working-directory: android/app
        run: |
          keytool -genkeypair -v -keystore release.keystore \
            -storepass biblioteca -keypass biblioteca -alias biblioteca \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Minha Biblioteca, OU=Peal, O=Peal, L=Jaragua do Sul, S=SC, C=BR"

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Preparar arquivo para download
        run: cp android/app/build/outputs/apk/release/app-release.apk MinhaBiblioteca.apk

      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 📚 Minha Biblioteca — Aplicativo Android
          body: |
            Baixe o arquivo **MinhaBiblioteca.apk** abaixo e instale no seu celular Android.

            Como instalar:
            1. Baixe o MinhaBiblioteca.apk no celular
            2. Toque no arquivo baixado
            3. Se pedir, permita "instalar de fontes desconhecidas"
            4. Pronto — o app instala com ícone próprio 📚

            O app carrega a biblioteca online e se atualiza sozinho.
          files: MinhaBiblioteca.apk
