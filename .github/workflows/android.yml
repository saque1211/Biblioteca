name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar projeto
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Gerar build
        run: npm run build

      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core
          npm install @capacitor/cli
          npm install @capacitor/android

      - name: Inicializar Capacitor
        run: |
          npx cap init Biblioteca com.biblioteca.app --web-dir=dist

      - name: Adicionar Android
        run: npx cap add android

      - name: Copiar arquivos
        run: npx cap copy

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verificar Java
        run: |
          java -version
          javac -version

      - name: Corrigir Kotlin duplicado
        run: |
          echo "configurations.all {" >> android/app/build.gradle
          echo "    configurations.all {" >> android/app/build.gradle
          echo "        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Biblioteca-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
